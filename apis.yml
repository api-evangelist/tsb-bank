name: TSB Bank
kind: company
description: >-
  TSB Bank plc is a British retail and commercial bank headquartered in
  Edinburgh, offering current accounts, savings, mortgages, personal loans,
  credit cards, and insurance to personal and business customers across the
  United Kingdom. Spun out of Lloyds Banking Group in 2013 and listed before
  being acquired in 2015, TSB is a wholly owned subsidiary of the Spanish
  banking group Banco Sabadell. It is authorised by the Prudential Regulation
  Authority and regulated by the Financial Conduct Authority and the PRA. As an
  FCA-authorised account servicing payment service provider (ASPSP) under PSD2,
  TSB participates in UK Open Banking and publishes its APIs conformant to the
  Open Banking Implementation Entity (OBIE) standards through a public developer
  portal at apis.developer.tsb.co.uk. TSB is not one of the nine CMA-mandated
  banks (CMA9) but implements the same OBIE Open Data and Read/Write API family:
  unauthenticated Open Data reference APIs plus FAPI-secured Account and
  Transaction Information (AIS), Payment Initiation (PIS), and Confirmation of
  Funds (CBPII) services secured with OAuth2/OIDC, mutual-TLS, and PSD2 strong
  customer authentication.
