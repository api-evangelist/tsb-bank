apis:
- aid: tsb-bank:tsb-account-transaction-information-api
  name: TSB Account and Transaction Information API (AIS)
  description: >-
    TSB's OBIE Read/Write Account and Transaction Information (AIS) API, providing authorised third-party
    providers read access to account, balance, transaction, beneficiary, standing order, direct debit,
    and statement data. FAPI-secured with OAuth2/OIDC, mutual-TLS, and PSD2 strong customer authentication;
    access requires developer-portal onboarding with OBIE/eIDAS certificates.
  humanURL: https://apis.developer.tsb.co.uk/
  baseURL: https://apis.tsb.co.uk
  tags:
  - Account Information
  - AIS
  - Open Banking
  properties:
  - type: Documentation
    url: https://apis.developer.tsb.co.uk/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
- aid: tsb-bank:tsb-payment-initiation-api
  name: TSB Payment Initiation API (PIS)
  description: >-
    TSB's OBIE Read/Write Payment Initiation (PIS) API, enabling authorised third-party providers to initiate
    domestic and scheduled payments and standing orders on behalf of consenting customers. FAPI-secured
    with OAuth2/OIDC, mutual-TLS, and PSD2 strong customer authentication; access requires developer-portal
    onboarding with OBIE/eIDAS certificates.
  humanURL: https://apis.developer.tsb.co.uk/
  baseURL: https://apis.tsb.co.uk
  tags:
  - Payment Initiation
  - PIS
  - Payments
  properties:
  - type: Documentation
    url: https://apis.developer.tsb.co.uk/
  - type: APIReference
    url: https://github.com/OpenBankingUK/read-write-api-specs
- aid: tsb-bank:tsb-confirmation-of-funds-api
  name: TSB Confirmation of Funds API (CBPII)
  description: >-
    TSB's OBIE Read/Write Confirmation of Funds (CBPII) API, allowing authorised card-based payment instrument
    issuers to confirm whether funds are available on a customer account. FAPI-secured with OAuth2/OIDC,
    mutual-TLS, and PSD2 strong customer authentication; access requires developer-portal onboarding with
    OBIE/eIDAS certificates.
  humanURL: https://apis.developer.tsb.co.uk/
  baseURL: https://apis.tsb.co.uk
  tags:
