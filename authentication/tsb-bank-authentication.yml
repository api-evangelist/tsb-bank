notes: >-
  Enriched from TSB's live OpenID Provider discovery document. TSB runs a Curity
  OAuth Toolkit (OTK) server as its OpenID Provider. The unauthenticated Open
  Data API carries no security scheme (public reference data). The FAPI-secured
  OBIE Read/Write services (AIS/PIS/CBPII) require OAuth2/OIDC with mutual-TLS
  client authentication, request-object signing, and PSD2 strong customer
  authentication, and are gated behind developer-portal onboarding with
  OBIE/eIDAS certificates.
